<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Demo Bank{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --bank-blue: #063b8f;
            --bank-blue-dark: #03245f;
            --bank-blue-light: #0d5bd7;
            --bank-yellow: #ffc928;
            --page-bg: #f4f7fb;
            --text-dark: #08245c;
        }

        body {
            background: var(--page-bg);
            color: var(--text-dark);
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #e6eaf0;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--bank-blue) !important;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--bank-blue);
            color: var(--bank-yellow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            font-weight: 800;
        }

        .hero {
            background:
                radial-gradient(
                    circle at 20% 80%,
                    rgba(28, 111, 255, 0.35),
                    transparent 35%
                ),
                linear-gradient(
                    120deg,
                    var(--bank-blue-light),
                    var(--bank-blue-dark)
                );

            color: white;
            padding: 65px 0 110px;
        }

        .hero-small {
            padding: 45px 0 80px;
        }

        .hero h1 {
            font-weight: 700;
        }

        .accent {
            color: var(--bank-yellow);
        }

        .content-card {
            border: none;
            border-radius: 18px;
            box-shadow:
                0 12px 35px rgba(20, 50, 100, 0.10);
        }

        .overlap-card {
            margin-top: -65px;
        }

        .btn-bank {
            background: var(--bank-yellow);
            border: none;
            color: #08245c;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px 22px;
        }

        .action-button {
            width: 150px;
            height: 46px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0;
        }

        .btn-bank:hover {
            background: #f2ba00;
            color: #08245c;
        }

        .btn-outline-bank {
            color: var(--bank-blue);
            border-color: var(--bank-blue);
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-outline-bank:hover {
            background: var(--bank-blue);
            color: white;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px 14px;
        }

        .metric-card {
            background: #f8faff;
            border: 1px solid #e7ecf5;
            border-radius: 14px;
            padding: 18px;
            height: 100%;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #6c7890;
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .status-active {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            background: #d9f7e7;
            color: #14804a;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .account-option {
            border: 1px solid #d9e2f0;
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
        }

        .account-option:hover {
            border-color: var(--bank-blue-light);
            background: #f5f9ff;
        }

        footer {
            color: #8993a6;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="brand-icon">D</span>
            Demo Bank
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Members</a>
            <a class="nav-link" href="#">Accounts</a>
            <a class="nav-link" href="#">Transactions</a>
        </div>

    </div>
</nav>

{% block content %}
{% endblock %}

<footer class="text-center py-5">
    Demo Bank Internal Operations Portal
</footer>

</body>
</html>
