{% extends "bank/base.html" %}

{% block title %}
Member Search
{% endblock %}

{% block content %}

<section class="hero text-center">
    <div class="container">

        <p class="text-uppercase fw-semibold mb-2">
            Member Services
        </p>

        <h1 class="display-5">
            Find a <span class="accent">member</span>
        </h1>

        <p class="mt-3">
            Search for a member to view account details
            and manage services.
        </p>

    </div>
</section>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card content-card overlap-card">

                <div class="card-body p-4 p-md-5">

                    <form method="POST">
                        {% csrf_token %}

                        <label
                            for="member_id"
                            class="form-label fw-semibold"
                        >
                            Member ID
                        </label>

                        <input
                            id="member_id"
                            name="member_id"
                            type="text"
                            class="form-control form-control-lg"
                            placeholder="Enter member ID, e.g. 12345"
                            required
                        >

                        <button
                            type="submit"
                            class="btn btn-bank w-100 mt-4"
                            id="search-button"
                        >
                            Search
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
